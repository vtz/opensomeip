name: Python Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Build C++ project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Run Python integration tests
        working-directory: tests/python
        run: >
          python -m pytest ../integration/ ../system/
          -v --tb=short -ra
          --junitxml=junit_results.xml
          --cov=someip_test_framework
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          -k "not performance and not slow"
        continue-on-error: true

      - name: Upload Python test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python
          path: tests/python/junit_results.xml
          retention-days: 14

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: tests/python/coverage.xml
          retention-days: 14

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [python-tests]
    if: always()
    permissions:
      checks: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-python*

      - name: Set test suite names in JUnit XML
        run: |
          for dir in test-results-*/; do
            suite=$(echo "$dir" | sed 's|^test-results-||;s|/$||')
            for xml in "$dir"*.xml; do
              [ -f "$xml" ] && sed -i "s/<testsuite name=\"pytest\"/<testsuite name=\"${suite}\"/" "$xml"
            done
          done

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        with:
          files: "**/*junit*.xml"
          check_name: "Python Test Results"
          comment_mode: "off"
          fail_on: "nothing"

      - name: Convert JUnit XML to CTRF
        if: always()
        run: npx junit-to-ctrf "test-results-*/**/*.xml" -o ctrf/python-report.json -t pytest

      - name: Detailed Test Report
        uses: ctrf-io/github-test-reporter@31e2a2735dd4641c65c2f49eb07e93ce8ec37fff # v1
        if: always()
        with:
          report-path: 'ctrf/python-report.json'
          title: 'Python Test Report'
          summary-report: true
          test-list-report: true
          failed-report: true
          suite-folded-report: true
          use-suite-name: true
          exit-on-fail: false
