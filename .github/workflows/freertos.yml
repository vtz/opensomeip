name: FreeRTOS Build & Test

on:
  workflow_call:
    inputs:
      rtos_paths_changed:
        description: Whether RTOS-specific paths changed (vs only shared code)
        type: boolean
        required: false
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    name: FreeRTOS PAL compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-compile-check-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-compile-check-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/freertos-compile-check/_deps
          key: fetchcontent-freertos-compile-check-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-compile-check-

      - name: Configure (freertos-compile-check preset)
        run: >
          cmake --preset freertos-compile-check
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset freertos-compile-check

  cross-compile-check:
    name: FreeRTOS ARM Cortex-M4 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM toolchain apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-arm-toolchain-${{ runner.os }}

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-cortexm4-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-cortexm4-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/freertos-cortexm4/_deps
          key: fetchcontent-freertos-cortexm4-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-cortexm4-

      - name: Configure (freertos-cortexm4 preset)
        run: >
          cmake --preset freertos-cortexm4
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset freertos-cortexm4

  runtime-tests:
    name: FreeRTOS POSIX port runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-linux-tests-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-linux-tests-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/freertos-linux-tests/_deps
          key: fetchcontent-freertos-linux-tests-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-linux-tests-

      - name: Configure (freertos-linux-tests preset)
        run: >
          cmake --preset freertos-linux-tests
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset freertos-linux-tests

      - name: Test
        run: ctest --preset freertos-linux-tests --output-junit junit_results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-freertos
          path: build/freertos-linux-tests/junit_results.xml
          retention-days: 14

  coverage:
    name: FreeRTOS coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-coverage-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-coverage-Debug-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build_freertos_cov/_deps
          key: fetchcontent-freertos-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-coverage-

      - name: Install coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcovr

      - name: Build with coverage
        run: |
          cmake -B build_freertos_cov \
            -DSOMEIP_FREERTOS_LINUX_TESTS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -S ${{ github.workspace }}
          cmake --build build_freertos_cov

      - name: Run tests
        working-directory: build_freertos_cov
        run: ctest --output-on-failure --timeout 30 --no-tests=error

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --filter 'src/' \
            --filter 'include/' \
            --exclude '.*test.*' \
            --exclude '.*example.*' \
            --xml coverage-freertos.xml \
            --print-summary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-freertos
          path: coverage-freertos.xml
          retention-days: 14

  memory-checks:
    name: FreeRTOS memory diagnostics (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-memory-checks-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-memory-checks-Debug-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/freertos-linux-tests/_deps
          key: fetchcontent-freertos-memcheck-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-memcheck-

      - name: Configure (Debug + sanitizers)
        run: >
          cmake --preset freertos-linux-tests
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS_DEBUG="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build --preset freertos-linux-tests

      - name: Test with memory diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset freertos-linux-tests --output-on-failure --timeout 60 --output-junit junit_results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-freertos-memcheck
          path: build/freertos-linux-tests/junit_results.xml
          retention-days: 14

  renode-cortexm4:
    name: FreeRTOS Cortex-M4 Renode Tests
    if: inputs.rtos_paths_changed || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RENODE_VERSION: "1.15.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-freertos-renode-cortexm4-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-freertos-renode-cortexm4-

      - name: Cache ARM toolchain apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-arm-toolchain-${{ runner.os }}

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/freertos-cortexm4-renode/_deps
          key: fetchcontent-freertos-renode-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-freertos-renode-

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: /opt/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          sudo mkdir -p /opt/renode
          sudo tar xzf "renode-${RENODE_VERSION}.linux-portable.tar.gz" -C /opt/renode --strip-components=1

      - name: Add Renode to PATH
        run: sudo ln -sf /opt/renode/renode /usr/local/bin/renode

      - name: Build & run FreeRTOS tests on Renode
        run: |
          cmake --preset freertos-cortexm4-renode -S "$GITHUB_WORKSPACE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$GITHUB_WORKSPACE/build/freertos-cortexm4-renode" -j"$(nproc)"
          ./scripts/run_freertos_renode_test.sh \
            --skip-build \
            --timeout 60 \
            --junit-output /tmp/freertos_renode_junit.xml

      - name: Upload Renode test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-freertos-renode
          path: /tmp/freertos_renode_junit.xml
          retention-days: 14

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [runtime-tests, memory-checks, renode-cortexm4]
    if: always()
    permissions:
      checks: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-freertos*

      - name: Set test suite names in JUnit XML
        run: |
          for dir in test-results-*/; do
            suite=$(echo "$dir" | sed 's|^test-results-||;s|/$||')
            for xml in "$dir"*.xml; do
              [ -f "$xml" ] && sed -i "s/<testsuite name=\"(empty)\"/<testsuite name=\"${suite}\"/" "$xml"
            done
          done

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        with:
          files: "**/*junit*.xml"
          check_name: "FreeRTOS Test Results"
          comment_mode: "off"
