name: Preset Validation

on:
  push:
    branches: ["main"]
    paths:
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
  pull_request:
    branches: ["main"]
    paths:
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'

permissions:
  contents: read

jobs:
  validate-host-presets:
    name: Validate host presets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - host-linux
          - host-linux-tests
          - static-alloc-linux-tests
          - freertos-compile-check
          - threadx-compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure (${{ matrix.preset }})
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

  validate-macos-presets:
    name: Validate macOS presets
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - host-macos
          - host-macos-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure (${{ matrix.preset }})
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

  validate-cross-presets:
    name: Validate cross-compile presets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - freertos-cortexm4
          - threadx-cortexm4
    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM toolchain apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-arm-toolchain-${{ runner.os }}

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure (${{ matrix.preset }})
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}
