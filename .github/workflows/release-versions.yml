# Compare VERSION with the other release version strings.
#
# CI ignores Markdown-only pull requests. This workflow does not, so a change
# that touches only README.md or CHANGELOG.md still runs the check.

name: Release versions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  release-versions:
    name: Release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version strings
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          ./scripts/check_release_versions.sh "v${version}"
          if ./scripts/check_release_versions.sh v0.0.0; then
            echo "::error::release version check accepted a mismatched tag"
            exit 1
          fi
