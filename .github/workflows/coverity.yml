name: Coverity Scan

on:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.cursor/**'

permissions:
  contents: read

jobs:
  coverity:
    runs-on: ubuntu-latest
    env:
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      COVERITY_EMAIL: ${{ vars.COVERITY_EMAIL }}
    steps:
      - name: Validate required configuration
        run: |
          missing=0
          if [ -z "${COVERITY_SCAN_TOKEN}" ]; then
            echo "::error::COVERITY_SCAN_TOKEN secret is not set"
            missing=1
          fi
          if [ -z "${COVERITY_EMAIL}" ]; then
            echo "::error::COVERITY_EMAIL repository variable is not set"
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v5

      - name: Check Coverity Scan availability
        id: health
        run: |
          if curl -sSf --head --retry 2 --max-time 15 \
              https://scan.coverity.com > /dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Coverity Scan service is unreachable — skipping scan"
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Coverity Build Tool
        if: steps.health.outputs.available == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            --data "token=${COVERITY_SCAN_TOKEN}&project=vtz%2Fopensomeip" \
            -o coverity_tool.tgz \
            https://scan.coverity.com/download/cxx/linux64
          mkdir -p coverity_tool
          tar xzf coverity_tool.tgz --strip-components=1 -C coverity_tool

      - name: Cache CMake FetchContent
        if: steps.health.outputs.available == 'true'
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-coverity-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-coverity-

      - name: Configure CMake
        if: steps.health.outputs.available == 'true'
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release

      - name: Build with cov-build
        if: steps.health.outputs.available == 'true'
        run: coverity_tool/bin/cov-build --dir cov-int cmake --build build

      - name: Submit to Coverity Scan
        if: steps.health.outputs.available == 'true'
        run: |
          tar czf analysis-results.tgz cov-int
          curl -fsS --retry 3 --retry-delay 10 \
            --form "token=${COVERITY_SCAN_TOKEN}" \
            --form "email=${COVERITY_EMAIL}" \
            --form file=@analysis-results.tgz \
            --form version="${{ github.sha }}" \
            --form description="Automated Coverity Scan from GitHub Actions" \
            "https://scan.coverity.com/builds?project=vtz%2Fopensomeip"
