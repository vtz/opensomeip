# SPDX-License-Identifier: Apache-2.0
name: Setup Python 3.12
description: >
  Install Python 3.12 from the deadsnakes PPA inside Zephyr CI containers
  (Ubuntu-based) and set it as the default python3.

inputs:
  python-version:
    description: Python version to install (major.minor)
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: |
        PY_VER='${{ inputs.python-version }}'
        if [[ ! "$PY_VER" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid python-version: $PY_VER (expected major.minor, e.g. 3.12)" >&2
          exit 1
        fi
        PY_BIN="/usr/bin/python${PY_VER}"

        apt-get update -qq
        apt-get install -y -qq software-properties-common > /dev/null
        add-apt-repository -y ppa:deadsnakes/ppa > /dev/null 2>&1
        apt-get update -qq
        apt-get install -y -qq "python${PY_VER}" "python${PY_VER}-venv" > /dev/null
        update-alternatives --install /usr/bin/python3 python3 "${PY_BIN}" 2
        "${PY_BIN}" -m ensurepip --upgrade
        "${PY_BIN}" -m pip install --upgrade pip
