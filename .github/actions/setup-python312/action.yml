# SPDX-License-Identifier: Apache-2.0
name: Setup Python 3.12
description: >
  Install Python 3.12 from the deadsnakes PPA inside Zephyr CI containers
  (Ubuntu-based) and set it as the default python3.

inputs:
  python-version:
    description: Python version to install (major.minor)
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: |
        apt-get update -qq
        apt-get install -y -qq software-properties-common > /dev/null
        add-apt-repository -y ppa:deadsnakes/ppa > /dev/null 2>&1
        apt-get update -qq
        apt-get install -y -qq python${{ inputs.python-version }} python${{ inputs.python-version }}-venv > /dev/null
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python${{ inputs.python-version }} 2
        python${{ inputs.python-version }} -m ensurepip --upgrade
        python${{ inputs.python-version }} -m pip install --upgrade pip
