# The CI container has no CAP_NET_ADMIN, so native TAP never comes up.
# On Ubuntu 26.04 net_config then waits out the whole test budget.
# NET_LOOPBACK is ignored unless NET_DRIVERS is enabled.
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=5
