# The CI job container has no CAP_NET_ADMIN, so native TAP never comes up.
# On Ubuntu 26.04 that leaves the Ethernet interface down and Zephyr's
# socket bind fails. This test only talks to itself.
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=5
