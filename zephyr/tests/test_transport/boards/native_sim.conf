# The CI container is not started with CAP_NET_ADMIN, so the native TAP
# driver cannot create an interface. Offload BSD sockets to the host stack;
# this test only sends to 127.0.0.1. Skip net_config, which would otherwise
# wait for a Zephyr interface that this driver does not bring up.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_CONFIG_SETTINGS=n
